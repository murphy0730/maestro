<!-- 应用图标源。几何与 BrandMark.tsx 一致，按 macOS Big Sur 图标网格摆放：
     1024 画布内 824×824 圆角方块居中，四周留出系统阴影余量。
     改这里后必须重跑 frontend/scripts/gen-app-icon.sh 才会反映到 .png / .icns。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#04060d"/>
  <g transform="translate(186 186) scale(27.17)">
    <polygon points="12,2.8 20,7.4 20,16.6 12,21.2 4,16.6 4,7.4" stroke="#29d8ff" stroke-width="1.7" stroke-linejoin="round"/>
    <polyline points="7.6,15.4 10.8,11.8 13.6,13.4 16.6,8.8" stroke="#e9effa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
    <circle cx="16.6" cy="8.8" r="1.7" fill="#29d8ff"/>
  </g>
</svg>
